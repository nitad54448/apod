<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Picture of the Day</title>
    
   <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Custom styles for the page */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0a09; /* A very dark, almost black background */
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.05) 1px, transparent 0),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 50px 50px;
            color: #e7e5e4; /* A soft off-white for text */
        }

        h1, h2 {
            font-family: 'Space Mono', monospace;
        }

        /* Styling for the loader animation */
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #44403c; /* stone-700 */
            border-bottom-color: #a78bfa; /* violet-400 */
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Custom styles for the date picker */
        input[type="date"] {
            background-color: #1c1917;
            border: 1px solid #44403c;
            color: #e7e5e4;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-5xl">

        <header class="text-center my-8">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-2">Astronomy Picture of the Day</h1>
            <p class="text-base text-stone-400">Explore the cosmos, one day at a time.</p>
        </header>

        <div class="flex flex-col sm:flex-row justify-center items-center gap-4 my-8">
            <div class="flex items-center gap-2">
                <label for="apod-date" class="text-stone-300">Select Date:</label>
                <input type="date" id="apod-date" name="apod-date">
            </div>
            <button id="random-btn" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">
                Get Random Picture
            </button>
        </div>

        <main id="apod-content" class="bg-stone-900/50 backdrop-blur-sm border border-stone-800 rounded-xl shadow-2xl p-4 sm:p-6 lg:p-8 min-h-[500px] flex justify-center items-center">
            
            <div id="loader" class="text-center">
                <div class="loader mx-auto"></div>
                <p class="mt-4 text-stone-400">Contacting NASA...</p>
            </div>

            <div id="apod-data" class="hidden w-full">
                <h2 id="apod-title" class="text-2xl sm:text-3xl font-bold text-white text-center mb-4"></h2>
                
                <div id="apod-media-container" class="mb-6 bg-black rounded-lg overflow-hidden flex justify-center items-center min-h-[300px]">
                </div>

                <div class="space-y-4">
                    <p class="text-stone-400 text-center"><strong>Date:</strong> <span id="apod-date-display"></span></p>
                    <p id="apod-explanation" class="text-base sm:text-lg text-stone-300 leading-relaxed"></p>
                    <p id="apod-copyright" class="text-sm text-stone-500 text-center italic"></p>
                </div>
            </div>
            
            <div id="error-container" class="hidden text-center max-w-lg mx-auto">
                 <p class="text-2xl text-red-400 font-bold mb-2">Houston, we have a problem.</p>
                 <p id="error-message" class="text-stone-300 mb-6"></p>
                 
                 <button id="retry-btn" class="hidden bg-stone-700 hover:bg-stone-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-300 border border-stone-600">
                    Try Again
                 </button>
            </div>

        </main>

        <footer class="text-center mt-8 py-4">
            <p class="text-stone-500 text-sm">
                Powered by the <a href="https://api.nasa.gov/" target="_blank" rel="noopener noreferrer" class="text-violet-400 hover:underline">NASA APOD API</a>.
            </p>
            <p class="text-stone-600 text-xs mt-1">
                All images and data are courtesy of NASA and the content owners.
            </p>
            <p class="text-stone-700 text-xs mt-2 font-mono">
                API Usage: <span id="rate-limit-display">Checking...</span> remaining
            </p>
            <details class="mt-3 text-xs text-stone-400">
                <summary class="cursor-pointer hover:text-stone-200 select-none">API Key Settings (using <span id="api-key-mode">DEMO_KEY</span>)</summary>
                <div class="mt-2 flex flex-wrap justify-center items-center gap-2">
                    <input type="password" id="api-key-input" placeholder="Optional NASA API key" autocomplete="off"
                           class="bg-stone-900 border border-stone-700 text-stone-200 rounded px-2 py-1 text-xs w-56">
                    <button type="button" id="save-key-btn" class="bg-violet-600 hover:bg-violet-700 text-white px-2.5 py-1 rounded text-xs">Save</button>
                    <button type="button" id="reset-key-btn" class="bg-stone-700 hover:bg-stone-600 text-stone-200 px-2.5 py-1 rounded text-xs">Use DEMO_KEY</button>
                </div>
            </details>
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element References ---
            const contentContainer = document.getElementById('apod-content');
            const loader = document.getElementById('loader');
            const apodDataContainer = document.getElementById('apod-data');
            
            // Error Elements
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            const retryBtn = document.getElementById('retry-btn');
            
            const titleEl = document.getElementById('apod-title');
            const mediaContainer = document.getElementById('apod-media-container');
            const dateDisplayEl = document.getElementById('apod-date-display');
            const explanationEl = document.getElementById('apod-explanation');
            const copyrightEl = document.getElementById('apod-copyright');
            const rateLimitDisplay = document.getElementById('rate-limit-display');

            const datePicker = document.getElementById('apod-date');
            const randomBtn = document.getElementById('random-btn');
            const apiKeyInput = document.getElementById('api-key-input');
            const saveKeyBtn = document.getElementById('save-key-btn');
            const resetKeyBtn = document.getElementById('reset-key-btn');
            const apiKeyMode = document.getElementById('api-key-mode');

            // --- Configuration ---
            const DEFAULT_API_KEY = 'DEMO_KEY';
            const API_KEY_STORAGE = 'nasa_apod_api_key';
            const API_URL = 'https://api.nasa.gov/planetary/apod';
            let lastAttemptedDate = null; // To store date for retrying

            // --- Functions ---

            function getApiKey() {
                try {
                    const saved = localStorage.getItem(API_KEY_STORAGE);
                    if (saved && saved.trim()) return saved.trim();
                } catch (e) { /* ignore storage errors */ }
                return DEFAULT_API_KEY;
            }

            function updateApiKeyUI() {
                const key = getApiKey();
                const isCustom = key !== DEFAULT_API_KEY;
                apiKeyMode.textContent = isCustom ? 'custom key' : 'DEMO_KEY';
                apiKeyInput.value = isCustom ? key : '';
            }

            function getNasaDate() {
                const now = new Date();
                return new Intl.DateTimeFormat('en-CA', { 
                    timeZone: 'America/New_York',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }).format(now);
            }

            async function fetchAPOD(date) {
                lastAttemptedDate = date; // Save for retry
                showLoader();
                
                let url = `${API_URL}?api_key=${encodeURIComponent(getApiKey())}`;
                if (date) {
                    url += `&date=${date}`;
                }

                try {
                    const response = await fetch(url);
                    
                    // Update Rate Limit
                    const remaining = response.headers.get("X-RateLimit-Remaining");
                    if (remaining) {
                        rateLimitDisplay.textContent = remaining;
                    }

                    if (!response.ok) {
                        // FIX: Read as text first to prevent JSON crash on empty body
                        const errorText = await response.text();
                        
                        // Handle Specific 504 / 503 Server Errors
                        if (response.status === 504 || response.status === 503 || response.status === 500) {
                             throw new Error(`NASA's servers are currently overloaded or down (Error ${response.status}). Please wait a moment and try again.`);
                        }

                        // Try to parse JSON error message from NASA
                        let errMsg = `HTTP error! status: ${response.status}`;
                        try {
                            const jsonError = JSON.parse(errorText);
                            if (jsonError.msg) errMsg = jsonError.msg;
                            else if (jsonError.error && jsonError.error.message) errMsg = jsonError.error.message;
                        } catch(e) {
                            // If not JSON, use the text if it's short
                            if (errorText && errorText.length < 100) errMsg = errorText;
                        }

                        throw new Error(errMsg);
                    }

                    const data = await response.json();
                    renderAPOD(data);

                } catch (error) {
                    console.error("Error fetching APOD data:", error);
                    
                    // Show Retry button if it looks like a network/server issue
                    const isServerIssue = error.message.includes('504') || error.message.includes('503') || error.message.includes('500') || error.message.includes('fetch');
                    showError(error.message, isServerIssue);
                }
            }
            
            function renderAPOD(data) {
                hideLoader();
                
                titleEl.textContent = data.title;
                dateDisplayEl.textContent = data.date;
                explanationEl.textContent = data.explanation;
                
                mediaContainer.innerHTML = '';

                if (data.media_type === 'image') {
                    const img = document.createElement('img');
                    img.src = data.hdurl || data.url;
                    img.alt = data.title;
                    img.className = 'max-w-full h-auto rounded-lg mx-auto shadow-lg';
                    // Wait for image to load to ensure layout is correct
                    img.onload = () => mediaContainer.classList.remove('animate-pulse');
                    mediaContainer.appendChild(img);
                } else if (data.media_type === 'video') {
                    const iframe = document.createElement('iframe');
                    iframe.src = data.url;
                    iframe.title = data.title;
                    iframe.frameBorder = '0';
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    iframe.allowFullscreen = true;
                    iframe.className = 'w-full aspect-video rounded-lg shadow-lg';
                    mediaContainer.appendChild(iframe);
                }

                if (data.copyright) {
                    copyrightEl.textContent = `© ${data.copyright}`;
                } else {
                    copyrightEl.textContent = '';
                }
                
                apodDataContainer.classList.remove('hidden');
            }

            function getRandomDate() {
                const startDate = new Date('1995-06-16').getTime();
                const endDateStr = getNasaDate();
                const endDate = new Date(endDateStr).getTime();
                
                const randomTime = startDate + Math.random() * (endDate - startDate);
                const randomDate = new Date(randomTime);
                return randomDate.toISOString().split('T')[0];
            }

            // --- UI Helper Functions ---
            
            function showLoader() {
                loader.classList.remove('hidden');
                apodDataContainer.classList.add('hidden');
                errorContainer.classList.add('hidden');
                retryBtn.classList.add('hidden');
            }

            function hideLoader() {
                loader.classList.add('hidden');
            }
            
            function showError(message, allowRetry = false) {
                hideLoader();
                apodDataContainer.classList.add('hidden');
                errorMessage.textContent = message;
                errorContainer.classList.remove('hidden');
                
                if (allowRetry) {
                    retryBtn.classList.remove('hidden');
                }
            }

            // --- Event Listeners ---
            
            randomBtn.addEventListener('click', () => {
                const randomDate = getRandomDate();
                datePicker.value = randomDate;
                fetchAPOD(randomDate);
            });

            datePicker.addEventListener('change', (e) => {
                const selectedDate = e.target.value;
                if(selectedDate) {
                    fetchAPOD(selectedDate);
                }
            });
            
            // Retry Button Listener
            retryBtn.addEventListener('click', () => {
                if (lastAttemptedDate) {
                    fetchAPOD(lastAttemptedDate);
                } else {
                    // Fallback if no date stored
                    fetchAPOD(getNasaDate());
                }
            });

            // API Key Settings Listeners
            saveKeyBtn.addEventListener('click', () => {
                const val = apiKeyInput.value.trim();
                try {
                    if (val) localStorage.setItem(API_KEY_STORAGE, val);
                    else localStorage.removeItem(API_KEY_STORAGE);
                } catch (e) { /* ignore storage errors */ }
                updateApiKeyUI();
                fetchAPOD(datePicker.value || getNasaDate());
            });

            resetKeyBtn.addEventListener('click', () => {
                try { localStorage.removeItem(API_KEY_STORAGE); } catch (e) { /* ignore */ }
                updateApiKeyUI();
                fetchAPOD(datePicker.value || getNasaDate());
            });

            // --- Initial Load ---
            updateApiKeyUI();
            const todayNASA = getNasaDate();
            datePicker.max = todayNASA; 
            datePicker.value = todayNASA;
            
            fetchAPOD(todayNASA); 
        });
    </script>

</body>
</html>
